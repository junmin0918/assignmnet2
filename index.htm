<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Media Player Website</title>

  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="style.css" />

  <script src="script.js" defer></script>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header>
    <h1>Media Player Website</h1>
  </header>

  <main class="container">

    <div class="media-player">

      <!-- Mouse particle canvas -->
      <canvas id="mouse-particles"></canvas>

      <div class="disc">
        <div class="disc-center"></div>
      </div>

      <video id="custom-video-player" muted>
        <source
          src="video/sphere.mp4"
          type="video/mp4"
        />
      </video>

      <audio
        id="audio"
        src="audio/montagem.mp3">
      </audio>

      <!-- =========================
           LIQUID PARTICLES
           ========================= -->

      <div class="splash">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

      </div>

      <!-- =========================
           VIDEO SELECTOR
           ========================= -->

      <div class="video-tabs">

        <nav>
          <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="playlist.html">PLAYLIST</a></li>
          </ul>
        </nav>

        <!-- =========================
             PLAY BUTTON
             ========================= -->

        <div class="custom-controls">

          <button
            id="play-pause-btn"
            onclick="togglePlayPause()"
          >
            <img
              id="play-pause-img"
              src="image/play.svg"
              alt="Play"
            />
          </button>

        </div>

        <!-- =========================
             REWIND BUTTONS
             ========================= -->

        <div class="rewind-controls">

          <button id="rewind-back-btn">
            <img
              src="image/rewind back.svg"
              alt="Rewind back"
            />
          </button>

          <button id="rewind-forward-btn">
            <img
              src="image/rewind forward.svg"
              alt="Rewind forward"
            />
          </button>

        </div>

        <!-- =========================
             FULLSCREEN
             ========================= -->

        <button id="fullscreen-btn">

          <img
            src="image/fullscreen.svg"
            alt="Fullscreen"
          >

        </button>

        <!-- =========================
             MUTE
             ========================= -->

        <button id="mute-btn">

          <img
            id="mute-img"
            src="image/sound.svg"
            alt="Sound"
          >

        </button>

        <!-- =========================
             LIKE
             ========================= -->

        <div class="playlist-like-container">

          <div class="like-section">

            <button id="like-btn">

              <img
                src="image/skull.jpg"
                alt="Like"
              >

            </button>

            <span id="like-count">0</span>

          </div>

        </div>

        <!-- =========================
             PROGRESS BAR
             ========================= -->

        <div class="progress-bar">
          <span id="progress-bar-fill"></span>
        </div>

      </div>

      <section>

      </section>

    </div>

  </main>

  <!-- =========================
       FOOTER
       ========================= -->

  <footer>

    <p>
      &copy; 2024 Media Player Website.
      All rights reserved.
    </p>

    <a href="https://icons8.com/icon/59862/play">
      Play
    </a>

    icon by

    <a href="https://icons8.com">
      Icons8
    </a>

    <a href="https://icons8.com/icon/61012/pause">
      Pause
    </a>

    icon by

    <a href="https://icons8.com">
      Icons8
    </a>

  </footer>

</body>

</html>
